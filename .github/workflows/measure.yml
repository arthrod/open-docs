name: Measure

# Every editor opening the three samples, on a machine that runs none of our other work
# (3 cores, slower than a laptop, and not idle: every run records its load):
# a GitHub-hosted macOS runner (Apple silicon), the installed Google Chrome,
# headed. A timing taken on a busy laptop is slower than the engine; the
# load average is recorded with every run.
#
# Runs when a branch named measure/<anything> is pushed (a workflow that is not
# on the default branch cannot be started by hand), or by hand once it is. The
# result files are the artifact "samples" (docs/samples/ and README.md, paths from the repository
# root): extract it at the root of the checkout and commit.
on:
  push:
    branches: ["measure/**"]
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per engine and sample"
        default: "3"

permissions:
  contents: read

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  samples:
    runs-on: macos-latest
    timeout-minutes: 200
    env:
      MEASURE_WHERE: GitHub Actions macos-latest runner (Apple silicon)
      # docen keeps the main thread busy for minutes on the 500 pages (one task of 162 s on an M-series
      # laptop, longer here): the page must be given time to answer.
      OD_TIMEOUT_S: "600"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Google Chrome
        run: |
          [ -d "/Applications/Google Chrome.app" ] || uv run --with playwright python -m playwright install chrome
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
      - name: Wait for the machine to calm down
        # A fresh runner is still busy with its own start-up (load average 67 on 3 cores was recorded
        # in the first run of 2026-11-17): wait for under 2 per core, five minutes at most.
        run: |
          for i in $(seq 30); do
            load=$(sysctl -n vm.loadavg | awk '{print $2}')
            echo "load average $load"
            awk -v l="$load" -v c="$(sysctl -n hw.ncpu)" 'BEGIN { exit !(l < 2 * c) }' && break
            sleep 10
          done
      - name: Every engine, every sample
        run: |
          uv run --with playwright python -I scripts/measure_samples.py all showcase,redline,lorem-500 "${{ inputs.runs || '5' }}" \
            --out "docs/samples/$(date +%F).json" --latest docs/samples/latest.json --shots shots
      - name: README tables from the new files
        run: python3 scripts/readme_tables.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samples
          path: |
            docs/samples/
            README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
