[package]
name = "wc-render"
description = "open-docs-viewer: WordCraft's own docx reader, layout and rasteriser, as a wasm module for a Deno server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wordcraft-docx = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-render = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
